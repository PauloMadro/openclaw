services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-alpine/openclaw:main}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_VERBOSE: "1"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/ape-002}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/ape-002/workspace}:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /home/node/.openclaw/openclaw.json ]; then
          cat > /home/node/.openclaw/openclaw.json << 'EOF'
        {
          "agents": {
            "defaults": {
              "model": { "primary": "openrouter/google/gemini-3-flash-preview" },
              "compaction": { "mode": "safeguard" }
            }
          },
          "commands": { "native": "auto", "nativeSkills": "auto", "restart": true },
          "channels": {
            "telegram": {
              "enabled": true,
              "botToken": "${TELEGRAM_BOT_TOKEN}",
              "dmPolicy": "open",
              "groupPolicy": "allowlist",
              "streaming": "off"
            }
          },
          "gateway": {
            "mode": "local",
            "bind": "lan",
            "auth": { "mode": "token", "token": "${OPENCLAW_GATEWAY_TOKEN}" }
          }
        }
        EOF
          echo "[init] default openclaw.json written"
        fi
        exec node openclaw.mjs gateway --allow-unconfigured --bind $${OPENCLAW_GATEWAY_BIND:-lan} --port 18789

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-alpine/openclaw:main}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      OPENCLAW_VERBOSE: "1"
    volumes:
      - /ape-010:/home/node/.openclaw
      - /ape-010/workspace:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18805}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18806}:18790"
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /home/node/.openclaw/openclaw.json ]; then
          if [ -n "$$TELEGRAM_BOT_TOKEN" ]; then
            TG_BLOCK='"telegram": { "enabled": true, "botToken": "'"$$TELEGRAM_BOT_TOKEN"'", "dmPolicy": "allowlist", "allowFrom": ["'"$$TELEGRAM_OWNER_ID"'"], "groupPolicy": "allowlist", "streaming": "off" }'
          else
            TG_BLOCK='"telegram": { "enabled": false }'
          fi
          cat > /home/node/.openclaw/openclaw.json << ENDOFCONFIG
        {
          "agents": {
            "defaults": {
              "model": { "primary": "openrouter/google/gemini-3-flash-preview" },
              "compaction": { "mode": "safeguard" }
            }
          },
          "commands": { "native": "auto", "nativeSkills": "auto", "restart": true },
          "channels": { $$TG_BLOCK },
          "gateway": {
            "mode": "local",
            "bind": "loopback",
            "auth": { "mode": "token", "token": "$$OPENCLAW_GATEWAY_TOKEN" }
          }
        }
        ENDOFCONFIG
          echo "[init] default openclaw.json written"
        fi
        if [ ! -d /home/node/.openclaw/extensions/townhall-plugin ]; then
          node openclaw.mjs plugins install /app/customsrc/townhall-plugin --link 2>/dev/null || echo "[init] townhall-plugin install skipped"
        fi
        exec node openclaw.mjs gateway --allow-unconfigured --bind $${OPENCLAW_GATEWAY_BIND:-loopback} --port 18789
